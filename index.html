<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AI Chat</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body id="body">
    <div class="app">
      <!-- CSS-only mobile menu -->
      <input type="checkbox" id="menu-toggle" />

      <!-- Mobile Header -->
      <header class="mobile-header">
        <div class="mobile-title">🤖 AI Assistant</div>

        <label for="menu-toggle" class="hamburger">
          <span></span>
          <span></span>
          <span></span>
        </label>
      </header>

      <!-- SIDEBAR -->

      <aside class="sidebar">
        <div class="brand">
          <div class="brand-icon">🤖</div>

          <div>
            <h1>AI Assistant</h1>
            <p>Your intelligent companion</p>
          </div>
        </div>

        <button class="new-chat">＋ New Chat</button>

        <div class="chat-history">
          <div class="section-title">Chats</div>

          <div class="chat-item active">
            <span class="chat-icon">▣</span>

            <span class="chat-title"> What is JavaScript? </span>

            <span class="chat-time"> 10:30 AM </span>
          </div>
        </div>
        <div class="clear-div">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            fill="#f21c1c"
            viewBox="0 0 256 256"
          >
            <path
              d="M216,48H176V40a24,24,0,0,0-24-24H104A24,24,0,0,0,80,40v8H40a8,8,0,0,0,0,16h8V208a16,16,0,0,0,16,16H192a16,16,0,0,0,16-16V64h8a8,8,0,0,0,0-16ZM96,40a8,8,0,0,1,8-8h48a8,8,0,0,1,8,8v8H96Zm96,168H64V64H192ZM112,104v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Zm48,0v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Z"
            ></path>
          </svg>
          <div class="clear">Clear Conversations</div>
        </div>
      </aside>

      <!-- CHAT -->

      <main class="chat-container">
        <!-- Header -->

        <header class="chat-header">
          <h2>What is JavaScript?</h2>
          <div class="clear-dark">
            <div class="dark">
              <div id="svg">
                <svg
                  class="svg-light"
                  xmlns="http://www.w3.org/2000/svg"
                  width="25"
                  viewBox="0 0 256 256"
                >
                  <path
                    d="M120,40V16a8,8,0,0,1,16,0V40a8,8,0,0,1-16,0Zm72,88a64,64,0,1,1-64-64A64.07,64.07,0,0,1,192,128Zm-16,0a48,48,0,1,0-48,48A48.05,48.05,0,0,0,176,128ZM58.34,69.66A8,8,0,0,0,69.66,58.34l-16-16A8,8,0,0,0,42.34,53.66Zm0,116.68-16,16a8,8,0,0,0,11.32,11.32l16-16a8,8,0,0,0-11.32-11.32ZM192,72a8,8,0,0,0,5.66-2.34l16-16a8,8,0,0,0-11.32-11.32l-16,16A8,8,0,0,0,192,72Zm5.66,114.34a8,8,0,0,0-11.32,11.32l16,16a8,8,0,0,0,11.32-11.32ZM48,128a8,8,0,0,0-8-8H16a8,8,0,0,0,0,16H40A8,8,0,0,0,48,128Zm80,80a8,8,0,0,0-8,8v24a8,8,0,0,0,16,0V216A8,8,0,0,0,128,208Zm112-88H216a8,8,0,0,0,0,16h24a8,8,0,0,0,0-16Z"
                  ></path>
                </svg>
              </div>
            </div>
            <div class="clear-div">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="18"
                height="18"
                fill="#fff"
                viewBox="0 0 256 256"
              >
                <path
                  d="M216,48H176V40a24,24,0,0,0-24-24H104A24,24,0,0,0,80,40v8H40a8,8,0,0,0,0,16h8V208a16,16,0,0,0,16,16H192a16,16,0,0,0,16-16V64h8a8,8,0,0,0,0-16ZM96,40a8,8,0,0,1,8-8h48a8,8,0,0,1,8,8v8H96Zm96,168H64V64H192ZM112,104v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Zm48,0v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Z"
                ></path>
              </svg>
              <button class="clear-chat">Clear Chat</button>
            </div>
          </div>
        </header>

        <!-- Messagees -->
        <section class="messages">
          <div id="chat">
            <!-- Messages will appear here -->
          </div>
        </section>
        <div class="input-area">
          <div class="input-box">
            <textarea id="prompt" placeholder="Ask something..."></textarea>
            <button id="sendBtn" class="send">➤ Send</button>
          </div>

          <div class="disclaimer">AI responses may not always be accurate.</div>
        </div>
      </main>
    </div>

      <h1>AI Chat</h1>

       <div class="input-area">
        <input type="text" id="prompt" placeholder="Ask something..." />

        <button id="sendBtn">Send</button>
      </div> 

    </div> -->

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
